quarkus.application.name=banking-service

quarkus.rest-client.register-situation-api.url=http://${QUARKUS_CLIENT_HTTP:localhost}:${QUARKUS_CLIENT_HTTP_PORT:8181}

quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${QUARKUS_DATASOURCE_USERNAME:admin}
quarkus.datasource.password = ${QUARKUS_DATASOURCE_PASSWORD:admin}
quarkus.datasource.reactive.url = postgresql://${QUARKUS_DATASOURCE_HOST:localhost}:${QUARKUS_DATASOURCE_PORT:5433}/agency

quarkus.micrometer.export.prometheus.path=/metrics

quarkus.opentelemetry.enables=true
quarkus.opentelemetry.tracer.exporter.otlp.endpoint=http://host.docker.internal:4318
quarkus.opentelemetry.tracer.exporter.otlp.protocol=http

quarkus.log.console.json.additional-field.application.value=banking-service-app

quarkus.devservices.enabled=false

mp.messaging.incoming.remove-agency-channel.connector=smallrye-kafka
mp.messaging.incoming.remove-agency-channel.topic=remove-agency-avro
mp.messaging.incoming.remove-agency-channel.value.type=br.com.mybanking.Agency
mp.messaging.incoming.remove-agency-channel.group.id=banking-service-consumer-group
mp.messaging.incoming.remove-agency-channel.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.remove-agency-channel.schema.registry.url=http://localhost:8081
mp.messaging.incoming.remove-agency-channel.bootstrap.servers=${QUARKUS_KAFKA_HOST:localhost}:${QUARKUS_KAFKA_PORT:9092}
mp.messaging.incoming.remove-agency-channel.auto.offset.reset=earliest

-- Uncomment the line above when you want to build native image.
quarkus.native.additional-build-args=--initialize-at-build-time=org.apache.avro.reflect.ReflectData$AllowNull,--initialize-at-build-time=java.lang.ProcessHandleImpl,--initialize-at-build-time=org.apache.avro.reflect.ReflectData,--initialize-at-build-time=io.confluent.kafka.schemaregistry.avro.AvroSchemaUtils

quarkus.redis.hosts=redis://localhost:6379
